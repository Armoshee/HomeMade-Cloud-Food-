<!-- Footer -->

    </footer>
<script>
(() => {
    let cart = {};
    try { cart = JSON.parse(localStorage.getItem("cloudFoodPicklesCart") || "{}") || {}; } catch {}
    const count = Object.values(cart).reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
    const label = document.getElementById("cart-count");
    if (label) label.textContent = String(count);
})();
</script>
