<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Order approval | HomeMade Cloud Food</title>
  <link rel="stylesheet" href="site.css">
  <style>
    main { max-width: 1040px; margin: 36px auto; padding: 0 20px 50px; }
    .admin-panel, .order-card { background: #fffaf2; border: 1px solid #e6c98a; border-radius: 14px; padding: 22px; margin: 18px 0; }
    .admin-login { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .admin-login label { flex: 1 1 320px; }
    .admin-login input { width: 100%; padding: 12px; }
    button { border: 0; border-radius: 8px; padding: 12px 20px; background: #8b241a; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .order-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .status { font-weight: 700; color: #7b251c; }
    .muted { color: #65584d; }
    .error { color: #a11d16; }
    .order-card dl { display: grid; grid-template-columns: minmax(120px, 180px) 1fr; gap: 7px 16px; }
    .order-card dt { font-weight: 700; }
    .order-card dd { margin: 0; overflow-wrap: anywhere; }
    @media(max-width:600px) { .order-card dl { grid-template-columns: 1fr; gap: 2px; } .order-card dd { margin-bottom: 8px; } }
  </style>
</head>
<body>
  <main>
    <h1>Shop order approvals</h1>
    <p>Check the payment in the bank account before approving. Approval sends a WhatsApp update to the customer.</p>
    <section class="admin-panel" aria-label="Admin sign in">
      <form class="admin-login" id="login-form">
        <label>Shop approval access token<input id="admin-token" type="password" autocomplete="current-password" required></label>
        <button type="submit">Open pending orders</button>
        <button type="button" id="sign-out" hidden>Sign out</button>
      </form>
    </section>
    <p id="status" class="muted" role="status" aria-live="polite"></p>
    <section id="orders" aria-live="polite"></section>
  </main>
<script>
(() => {
  const tokenInput = document.getElementById("admin-token");
  const status = document.getElementById("status");
  const list = document.getElementById("orders");
  const signOut = document.getElementById("sign-out");
  let token = sessionStorage.getItem("shopApprovalToken") || "";
  const money = amount => "₹" + new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 }).format(Number(amount) || 0);
  function el(tag, text, className) { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (className) node.className = className; return node; }
  async function api(url, options = {}) {
    const response = await fetch(url, { ...options, headers: { "Authorization": "Bearer " + token, ...(options.headers || {}) } });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || "Request failed.");
    return body;
  }
  function renderOrder(order) {
    const card = el("article", undefined, "order-card");
    const head = el("div", undefined, "order-head");
    const title = el("h2", order.displayOrderId || order.id);
    const state = el("span", order.status.replaceAll("_", " "), "status");
    head.append(title, state); card.append(head);
    card.append(el("p", (order.customerName || "") + " · " + (order.customerPhone || "")));
    const rows = [
      ["Created", new Date(order.createdAt).toLocaleString()],
      ["Payment", order.paymentMethod + (order.paymentReference ? " · UTR " + order.paymentReference : "")],
      ["Total", money(order.total)],
      ["Items", (order.items || []).map(item => item.name + " × " + item.qty).join(", ")],
      ["Delivery", [order.address, order.city, order.state, order.country, order.pincode].filter(Boolean).join(", ")],
      ["Notes", order.notes || "—"]
    ];
    const dl = el("dl");
    for (const [label, value] of rows) { dl.append(el("dt", label), el("dd", value)); }
    card.append(dl);
    if (order.status === "PENDING_APPROVAL" || order.status === "PAID_PENDING_APPROVAL") {
      const button = el("button", "Approve and notify customer");
      button.addEventListener("click", async () => {
        if (!confirm("Have you verified the payment in your bank account? This will send the customer a WhatsApp approval message.")) return;
        button.disabled = true; status.className = "muted"; status.textContent = "Sending WhatsApp approval…";
        try { await api("/api/admin/orders/" + encodeURIComponent(order.id) + "/approve", { method: "POST" }); status.textContent = "Order " + order.displayOrderId + " approved; the WhatsApp message was accepted."; await loadOrders(); }
        catch (error) { status.className = "error"; status.textContent = error.message; button.disabled = false; }
      });
      card.append(button);
    } else if (order.approvedAt) card.append(el("p", "Approved " + new Date(order.approvedAt).toLocaleString(), "muted"));
    return card;
  }
  async function loadOrders() {
    status.className = "muted"; status.textContent = "Loading orders…"; list.replaceChildren();
    try {
      const result = await api("/api/admin/orders");
      signOut.hidden = false;
      if (!result.orders.length) { status.textContent = "No orders have been submitted yet."; return; }
      status.textContent = "";
      for (const order of result.orders) list.append(renderOrder(order));
    } catch (error) { status.className = "error"; status.textContent = error.message; }
  }
  document.getElementById("login-form").addEventListener("submit", event => { event.preventDefault(); token = tokenInput.value; sessionStorage.setItem("shopApprovalToken", token); loadOrders(); });
  signOut.addEventListener("click", () => { token = ""; sessionStorage.removeItem("shopApprovalToken"); tokenInput.value = ""; list.replaceChildren(); status.textContent = "Signed out."; signOut.hidden = true; });
  if (token) { tokenInput.value = token; loadOrders(); }
})();
</script>
</body>
</html>
